<!-- Illustration style test, run A — drawn in SVG by the agent from the spec (art-direction Step 4).
     Spec: technical "flight plan" line drawing. Bone line 1.5px at 82% on ground; ONE active element in amber;
     planned paths dotted (2 7), completed paths solid; mono labels, uppercase, tracked; orthographic, no perspective;
     no fills but node dots; people are never drawn as figures — the operator is a marked point. -->
<style>
  body{margin:0;background:#0F0C07;display:flex;flex-wrap:wrap;gap:12px;padding:12px;align-items:flex-start}
  .ill{background:#0F0C07;border:1px solid #3A3020;border-radius:8px;display:block}
  .ill .ln{stroke:#ECE4D6;stroke-opacity:.82;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ill .fn{stroke:#ECE4D6;stroke-opacity:.28;stroke-width:1;fill:none}
  .ill .pl{stroke-dasharray:2 7}
  .ill .act{stroke:#E8830C;stroke-opacity:1}
  .ill .dot{fill:#ECE4D6;fill-opacity:.82}
  .ill .adot{fill:#E8830C}
  .ill .lbl{font:500 9.5px 'JetBrains Mono',monospace;letter-spacing:.14em;fill:#988B71;text-transform:uppercase}
  .ill .albl{fill:#F4A93C}
  .ill .br{stroke:#4A3D24;stroke-width:1;fill:none}
</style>
